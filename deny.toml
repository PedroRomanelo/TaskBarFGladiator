# Configuração do cargo-deny. Ver docs/02-fase-0-preparacao.md, seção 1.5, e docs/07-seguranca.md.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # O jogo não usa rede (docs/07-seguranca.md, seção 2.5).
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
