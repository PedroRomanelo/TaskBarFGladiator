name: CI

# Execução apenas manual (aba Actions > CI > Run workflow), para não consumir minutos do GitHub
# Actions. Para voltar a rodar a cada push/PR, troque por:
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-portable:
    name: testes portáveis (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  windows:
    name: build + testes (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p taskbar-gladiator
      - name: Tamanho do executável (< 3 MB)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/taskbar-gladiator.exe).Length
          Write-Host "Tamanho: $size bytes"
          if ($size -gt 3MB) { throw "Executável maior que 3 MB" }
      - name: Smoke test (inicia, roda 10 s, sem crash)
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA "TaskBarFGladiator\logs"
          $p = Start-Process -FilePath target/release/taskbar-gladiator.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "O executável encerrou sozinho (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if (Test-Path $logs) {
            Get-ChildItem $logs | Format-Table Name, Length
            Get-Content (Join-Path $logs "game.log") -ErrorAction SilentlyContinue
            if (Get-ChildItem $logs -Filter "crash-*.txt") { throw "Relatório de crash gerado" }
          }

  balance:
    name: balanceamento (metas + baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Metas (docs/12, seção 3)
        run: cargo run --release --locked -p sim -- check
      - name: Baseline (igualdade exata)
        run: cargo run --release --locked -p sim -- verify-baseline

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
